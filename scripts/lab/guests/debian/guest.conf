# Debian lab guests (bash, sourced by scripts/lab/qemu/prepare.sh and guests/debian/guest.sh
# with GUEST set). Its text is part of the prepared image's key: editing it re-prepares.
#
# debian: the Debian 13 nocloud image (r3-tc's fixture) with openssh-server, sshfs, nftables,
# sudo, doas and grub2-common, root's ssh key baked in, an empty root password (console logins
# as the image promises), a getty on hvc2 for the lab's console driver, systemd as PID 1.
# debian-sysv: that image converted to sysvinit (PID 1 = /sbin/init, ifupdown networking, an
# inittab getty on hvc2) for the inittab and rc.local rows.

case "$GUEST" in
debian)
	GUEST_BASE=debian-13-nocloud-arm64.raw
	GUEST_PREPARE="$LAB_DIR/guests/debian/prepare.sh" ;;
debian-sysv)
	GUEST_FROM=debian
	GUEST_PREPARE="$LAB_DIR/guests/debian/prepare-sysv.sh" ;;
esac
GUEST_OS=debian
GUEST_USER=root
GUEST_DISK_GIB=8

# deb_console <run> <name> <console> <timeout> <command>: one command as root on a console
# that is logged in already (or logs in: the root password is empty once prepared).
deb_console() {
	"$(lab_tool python3)" "$LAB_QEMU_DIR/console.py" "$1/qemu/$2/$3.sock" \
		--transcript "$1/qemu/$2/$3.transcript" run --timeout "$4" -- "$5"
}

# provision <build dir> <run root>
provision() {
	case "$GUEST" in
	debian) provision_debian "$@" ;;
	debian-sysv) provision_sysv "$@" ;;
	esac
}

# The stock image: systemd-firstboot asks on the system console (the PL011 under QEMU) before
# the first login; answer it, log in on hvc0, install sshd and the key, then run prepare.sh.
provision_debian() {
	local b="$1" run="$2" name="prep-$GUEST" py pub
	py="$(lab_tool python3)"
	pub="$(cat "$b/id_ed25519.pub")"
	prep_boot "$b" "$run" "$name" --consoles 3 || return 1
	"$py" "$LAB_QEMU_DIR/console.py" "$run/qemu/$name/serial.sock" \
		--transcript "$run/qemu/$name/serial.transcript" firstboot --root-password lab \
		--timeout 300 || { prep_log "systemd-firstboot was not answered"; return 1; }
	"$py" "$LAB_QEMU_DIR/console.py" "$run/qemu/$name/hvc0.sock" \
		--transcript "$run/qemu/$name/hvc0.transcript" login --user root --password lab \
		--nudge 5 --timeout 120 || { prep_log "no root login on hvc0"; return 1; }
	deb_console "$run" "$name" hvc0 60 "passwd -d root >/dev/null" || return 1
	deb_console "$run" "$name" hvc0 60 "mkdir -p -m 700 /root/.ssh && echo '$pub' \
> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys" || return 1
	deb_console "$run" "$name" hvc0 900 "export DEBIAN_FRONTEND=noninteractive; \
apt-get update -qq >/var/log/lab-sshd-install.log 2>&1 && apt-get install -y -qq \
openssh-server >>/var/log/lab-sshd-install.log 2>&1 && systemctl enable --now ssh" \
		|| { prep_log "openssh-server did not install (see the guest's lab-sshd-install.log)"
			return 1; }
	"$py" "$LAB_QEMU_DIR/console.py" "$run/qemu/$name/hvc0.sock" send exit >/dev/null 2>&1
	prep_wait_ssh "$run" "$name" root "$b/id_ed25519" 120 || return 1
	prep_ssh "$run" "$name" root "$b/id_ed25519" 'sh -s' < "$GUEST_PREPARE" \
		|| { prep_log "prepare.sh failed (/var/lib/machman-lab/prepare.log)"; return 1; }
	prep_ssh "$run" "$name" root "$b/id_ed25519" cat /var/lib/machman-lab/manifest \
		> "$b/manifest" || return 1
	prep_ssh "$run" "$name" root "$b/id_ed25519" 'systemctl poweroff' >/dev/null 2>&1
	prep_wait_exit "$run" "$name" 180
}

# From the prepared debian image (its baked key gets in): install sysvinit, reboot into it,
# verify PID 1, swap in this image's own key.
provision_sysv() {
	local b="$1" run="$2" name="prep-$GUEST" parent_key="${BASE%.raw}.id_ed25519" end
	cp "$parent_key" "$b/parent_key"
	chmod 600 "$b/parent_key"
	prep_boot "$b" "$run" "$name" --consoles 3 || return 1
	prep_wait_ssh "$run" "$name" root "$b/parent_key" 180 || return 1
	prep_ssh "$run" "$name" root "$b/parent_key" 'sh -s install' < "$GUEST_PREPARE" \
		|| { prep_log "prepare-sysv.sh install failed"; return 1; }
	prep_ssh "$run" "$name" root "$b/parent_key" \
		'(sleep 1; systemctl reboot) >/dev/null 2>&1 </dev/null &' || return 1
	end=$((SECONDS + 120))
	while prep_ssh "$run" "$name" root "$b/parent_key" true </dev/null >/dev/null 2>&1; do
		[ "$SECONDS" -ge "$end" ] && { prep_log "the guest did not go down"; return 1; }
		sleep 2
	done
	prep_wait_ssh "$run" "$name" root "$b/parent_key" 300 || return 1
	prep_ssh "$run" "$name" root "$b/parent_key" 'sh -s verify' < "$GUEST_PREPARE" \
		|| { prep_log "PID 1 is not sysvinit after the reboot"; return 1; }
	prep_ssh "$run" "$name" root "$b/parent_key" cat /var/lib/machman-lab/manifest \
		> "$b/manifest" || return 1
	prep_ssh "$run" "$name" root "$b/parent_key" \
		"cat > /root/.ssh/authorized_keys" < "$b/id_ed25519.pub" || return 1
	rm -f "$b/parent_key"
	prep_ssh "$run" "$name" root "$b/id_ed25519" 'poweroff' >/dev/null 2>&1
	prep_wait_exit "$run" "$name" 180
}
