# The Alpine disk guest (r3-th; bash, sourced by scripts/lab/qemu/prepare.sh with GUEST set).
# Its text is part of the prepared image's key: editing it re-prepares.
#
# alpine-disk: Alpine 3.24's generic aarch64 cloud image (cloud-init, NoCloud; UEFI through
# limine) installed for the Guest Setup rows that need a real Alpine: OpenRC, /etc/inittab,
# apk. openssh, sshfs, doas, sudo, nftables and util-linux; root without a password on the
# consoles (hvc0-2 in /etc/securetty) and a getty on hvc2 for the lab's console driver; no
# regular user; cloud-init off for every later boot.

GUEST_BASE=alpine-3.24.2-aarch64-cloudinit-r0.raw
GUEST_PREPARE="$LAB_DIR/guests/alpine-disk/prepare.sh"
GUEST_OS=alpine
GUEST_USER=root
GUEST_DISK_GIB=4

# provision <build dir> <run root>: the image's own user "alpine" (wheel, doas without a
# password; root is locked, so sshd lets no root in) gets the baked key from a NoCloud seed;
# one boot with open networking, prepare.sh as root through doas, the manifest, then the user
# goes and the guest powers off.
provision() {
	local b="$1" run="$2" name="prep-$GUEST" u=alpine
	{
		echo '#cloud-config'
		echo 'ssh_pwauth: false'
		echo 'ssh_authorized_keys:'
		echo "  - $(cat "$b/id_ed25519.pub")"
	} > "$b/user-data"
	"$LAB_QEMU_DIR/seed.sh" "$b/seed.iso" --instance-id "lab-prep-$PREP_KEY" \
		--hostname lab-alpine --user-data "$b/user-data" >/dev/null || return 1
	prep_boot "$b" "$run" "$name" --seed "$b/seed.iso" --consoles 3 || return 1
	prep_wait_ssh "$run" "$name" "$u" "$b/id_ed25519" 300 || return 1
	if ! prep_ssh "$run" "$name" "$u" "$b/id_ed25519" 'doas sh -s' < "$GUEST_PREPARE"; then
		prep_log "prepare.sh failed; the end of its log:"
		prep_ssh "$run" "$name" "$u" "$b/id_ed25519" \
			'doas tail -n 30 /var/lib/machman-lab/prepare.log' </dev/null >&2
		return 1
	fi
	prep_ssh "$run" "$name" "$u" "$b/id_ed25519" cat /var/lib/machman-lab/manifest \
		> "$b/manifest" || return 1
	prep_ssh "$run" "$name" "$u" "$b/id_ed25519" \
		"doas sh -c 'deluser --remove-home $u; poweroff'" >/dev/null 2>&1
	prep_wait_exit "$run" "$name" 180
}
