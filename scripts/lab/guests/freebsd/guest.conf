# FreeBSD lab guests (bash, sourced by scripts/lab/qemu/prepare.sh and guests/freebsd/guest.sh
# with GUEST set). Its text is part of the prepared image's key: editing it re-prepares.
#
# freebsd14 / freebsd15: the stock BASIC-CLOUDINIT UFS image with doas, sudo and fusefs-sshfs,
# the user lab (wheel, the baked key, doas/sudo without a password), sshd on. Root logs in on
# the serial console (ttyu0, the kernel console) without a password, as the stock image does.

case "$GUEST" in
freebsd14) GUEST_BASE=freebsd-14.5-aarch64-cloudinit-ufs.raw GUEST_VERSION=14.5 ;;
freebsd15) GUEST_BASE=freebsd-15.1-aarch64-cloudinit-ufs.raw GUEST_VERSION=15.1 ;;
esac
GUEST_OS=freebsd
GUEST_USER=lab
GUEST_DISK_GIB=8
GUEST_PACKAGES="doas sudo fusefs-sshfs"
GUEST_PREPARE="$LAB_DIR/guests/freebsd/prepare.sh"

# provision <build dir> <run root>: boot the clone in <build dir>/disk.raw once with a seed
# whose runcmd is prepare.sh, wait for its marker, keep the manifest, power off.
provision() {
	local b="$1" run="$2" name="prep-$GUEST" start ran=""
	"$LAB_QEMU_DIR/seed.sh" "$b/seed.iso" --instance-id "lab-prep-$PREP_KEY" \
		--hostname "lab-$GUEST" --user "$GUEST_USER" --key "$b/id_ed25519.pub" --groups wheel \
		--doas "permit nopass $GUEST_USER" --packages "$GUEST_PACKAGES" \
		--runcmd-file "$GUEST_PREPARE" >/dev/null || return 1
	prep_boot "$b" "$run" "$name" --seed "$b/seed.iso" --consoles 0 || return 1
	prep_wait_ssh "$run" "$name" "$GUEST_USER" "$b/id_ed25519" 900 || return 1
	start=$SECONDS
	until prep_ssh "$run" "$name" "$GUEST_USER" "$b/id_ed25519" \
		test -f /var/db/machman-lab/prepared; do
		[ $((SECONDS - start)) -ge 1200 ] && { prep_log "no prepared marker in 20 min"; return 1; }
		# A nuageinit without runcmd (or without packages): run prepare.sh as root on the
		# serial console once nuageinit is done and nothing started it.
		if [ -z "$ran" ] && [ $((SECONDS - start)) -ge 60 ] \
			&& prep_ssh "$run" "$name" "$GUEST_USER" "$b/id_ed25519" \
				'! pgrep -q nuageinit && ! test -e /var/db/machman-lab/prepare.log'
		then
			prep_log "nuageinit ran no runcmd: running prepare.sh on the serial console"
			prep_scp "$run" "$name" "$GUEST_USER" "$b/id_ed25519" "$GUEST_PREPARE" \
				/tmp/machman-lab-prepare.sh || return 1
			prep_console "$run" "$name" serial root 300 'sh /tmp/machman-lab-prepare.sh' \
				|| return 1
			ran=console
		fi
		sleep 10
	done
	prep_ssh "$run" "$name" "$GUEST_USER" "$b/id_ed25519" cat /var/db/machman-lab/manifest \
		> "$b/manifest" || return 1
	echo "prepared-by ${ran:-nuageinit}" >> "$b/manifest"
	prep_ssh "$run" "$name" "$GUEST_USER" "$b/id_ed25519" doas shutdown -p now >/dev/null 2>&1
	prep_wait_exit "$run" "$name" 180
}
